name: icons
on:
  push:
    paths:
      - '.github/workflows/icons.yml'
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make
        run: |
          echo '' | base64 -d > icon-192.png
          pip install -q pillow
          python3 -c "from PIL import Image;Image.open('icon-192.png').convert('RGBA').resize((512,512),Image.LANCZOS).save('icon-512.png')"
          git rm -q --ignore-unmatch IMG-20261126-WA0081.png IMG-20261126-WA0081.jpg
          printf '%s' '{"name":"Saedni AI","short_name":"Saedni","start_url":"./","scope":"./","display":"standalone","background_color":"#0b1020","theme_color":"#0b1020","lang":"ar","dir":"rtl","description":"مساعد ذكاء اصطناعي عربي للدردشة","id":"./","icons":[{"src":"icon-192.png","sizes":"192x192","type":"image/png","purpose":"any"},{"src":"icon-512.png","sizes":"512x512","type":"image/png","purpose":"any"}]}' > manifest.webmanifest
          git config user.name bot
          git config user.email bot@example.com
          git add -A
          git commit -m icons
          git push
